<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <meta name="referrer" content="no-referrer" />
        <title>Reset Password — PyBlocks</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="assets/images/brand-icons/favicon.svg"
        />
        <link rel="stylesheet" href="css/home.css" />
        <link rel="stylesheet" href="css/community.css" />
        <link rel="stylesheet" href="css/settings.css" />
        <link rel="stylesheet" href="css/password-reset.css" />
    </head>
    <body class="marketing-page community-page">
        <nav class="site-nav">
            <a class="brand" href="index.html"
                ><span class="brand-mark">Py</span>PyBlocks</a
            >
            <a class="nav-link" href="index.html">Home</a>
        </nav>
        <main class="password-reset-shell">
            <section class="password-reset-card">
                <p class="eyebrow">ACCOUNT RECOVERY</p>
                <h1>Choose a new password</h1>
                <p>
                    Enter it twice so we can make sure there are no typing
                    mistakes.
                </p>
                <form id="password-reset-form" class="account-form">
                    <label>
                        New password
                        <input
                            name="password"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        />
                    </label>
                    <label>
                        Confirm new password
                        <input
                            name="confirmation"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        />
                    </label>
                    <button class="primary-cta" type="submit">
                        Change Password
                    </button>
                    <p
                        id="password-reset-status"
                        role="status"
                        aria-live="polite"
                    >
                        Open this page using the secure link in your reset
                        email.
                    </p>
                </form>
            </section>
        </main>
        <script src="js/cloud-config.js"></script>
        <script src="vendor/supabase.js"></script>
        <script src="js/password-reset.js"></script>
        <script src="js/theme-settings.js"></script>
    </body>
</html>
